<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-preload" content="true">
    <meta name="aui-viewport" content="mode=gui,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
    <style>
        * { user-select: none; pointer-events: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body { position: relative; color: #ffffff; }
        /* Glyphs and widths come from Minecraft.font through AmmoHudText, including resource-pack fonts. */
        sbw-hud-text { display: block; flex-shrink: 0; }
        /* W = 57, A = 96. The root origin comes from existing MC GUI/config offsets. */
        #ammo-bar { position: absolute; width: 176px; height: 80px; transform-origin: 0 0; pointer-events: none; }
        .name { position: absolute; left: -23px; width: 160px; }
        #gun-name { top: 4px; }
        #ammo-name { top: 14px; color: #c8a679; }
        #gun-icon { position: absolute; left: 25px; top: 24px; width: 64px; height: 16px; transform-origin: center; }
        #ammo-row { position: absolute; left: 96px; top: 21px; display: flex; align-items: flex-start; white-space: nowrap; }
        #virtual-ammo { position: relative; top: -6px; margin-left: 4px; color: #55ffff; }
        #backup-ammo { position: absolute; left: 96px; top: 34px; }
        /* 弱化色：备用弹药与只有一种开火模式的切换键共用同一个色号。 */
        .sbw-muted { color: #cccccc; }
        /* The 16px mode box also accommodates RPM textures. */
        #fire-mode-key { position: absolute; right: 120.5px; top: 47px; }
        #fire-mode-seat { position: absolute; left: 58.5px; top: 41px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
        #fire-mode-line { position: absolute; left: 62.5px; top: 50px; width: 8px; height: 8px; }
        /* AUI 1.3 defaults textures to linear filtering; these icons are pixel art. */
        #fire-mode-icon, #fire-mode-line { image-rendering: pixelated; }
        .ordinal { position: absolute; top: 59px; height: 7px; display: flex; justify-content: center; }
        #fire-mode-index { left: 58.5px; width: 16px; }
        .index-current { color: #ffffff; }
        .index-total { color: #888888; }
        #resource-seat { position: absolute; left: 96px; top: 0; width: 12px; height: 80px; }
        /* Frames/plus signs stay fixed while item groups slide. Only surplus frames enter/leave. */
        #resource-viewport { position: absolute; left: -10px; top: 43px; width: 32px; height: 16px; overflow: hidden; }
        /* Native paint snapshots move icons; the AUI element itself has stable geometry. */
        #resource-content { position: absolute; left: 10px; top: 2px; height: 12px; display: block; }
        #ammo-type-index { left: 0; width: 12px; }
    </style>
</head>
<body>
    <div id="ammo-bar">
        <sbw-hud-text id="gun-name" class="name" data-scale="0.9" data-fixed-width="true" data-align="center"></sbw-hud-text>
        <sbw-hud-text id="ammo-name" class="name" data-scale="0.7" data-fixed-width="true" data-align="center"></sbw-hud-text>
        <texture id="gun-icon" />
        <div id="ammo-row"><sbw-hud-text id="ammo-count" data-scale="1.5"></sbw-hud-text><sbw-hud-text id="virtual-ammo" data-scale="0.8"></sbw-hud-text></div>
        <sbw-hud-text id="backup-ammo" class="sbw-muted" data-scale="1"></sbw-hud-text>
        <sbw-hud-text id="fire-mode-key" data-scale="1"></sbw-hud-text>
        <div id="fire-mode-seat"><texture id="fire-mode-icon" /></div>
        <texture id="fire-mode-line" src="superbwarfare:textures/overlay/ammo_bar/fire_mode/line.png" />
        <div id="fire-mode-index" class="ordinal"><sbw-hud-text id="fire-mode-index-current" class="index-current" data-scale="0.7"></sbw-hud-text><sbw-hud-text id="fire-mode-index-total" class="index-total" data-scale="0.7"></sbw-hud-text></div>
        <div id="resource-seat">
            <div id="resource-viewport"><sbw-hud-resources id="resource-content"></sbw-hud-resources></div>
            <div id="ammo-type-index" class="ordinal"><sbw-hud-text id="ammo-type-index-current" class="index-current" data-scale="0.7"></sbw-hud-text><sbw-hud-text id="ammo-type-index-total" class="index-total" data-scale="0.7"></sbw-hud-text></div>
        </div>
    </div>
</body>
</html>
