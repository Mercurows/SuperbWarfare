<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-viewport" content="mode=gui,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
    <meta name="aui-mouse-events" content="intercept">
</head>
<body>
    <div id="backdrop"></div>
    <div id="title-bar">
        <div id="title-accent"></div>
        <div id="title-brand">SUPERB WARFARE</div>
        <div class="title-separator"></div>
        <div id="title-mode"></div>
        <div class="title-separator"></div>
        <div id="title-weapon"></div>
        <div id="title-status">
            <div id="title-status-dot"></div>
            <div id="title-status-label">IN GAME</div>
            <div class="title-separator"></div>
            <div id="title-version"></div>
        </div>
    </div>
    <!-- AUI 负责挂点命中区域和图标布局；圆圈、外框与连线由 WeaponEditScreen 独立绘制。 -->
    <div id="mount-layer" class="layer"></div>
    <div id="icon-layer" class="layer"></div>
    <div id="weapon-stats">
        <button id="stats-toggle" type="button" aria-expanded="false"><span id="stats-toggle-label" class="button-label"></span></button>
        <div id="stats-chart">
            <div id="stats-index" class="section-index"><span class="section-number">01</span><span class="section-slash">/</span></div>
            <div id="stats-title"></div>
            <div id="stats-code" class="section-code">SBW-ATTR</div>
            <div id="stats-scroll"><div id="stats-content"></div></div>
        </div>
    </div>
    <div id="gun-skin-control"><select id="gun-skin"></select></div>
    <div id="panel">
        <div id="panel-index" class="section-index"><span class="section-number">03</span><span class="section-slash">/</span></div>
        <div id="panel-title"></div>
        <div id="panel-code" class="section-code"></div>
        <div id="panel-header">
            <div id="panel-current" class="attachment-icon">
                <slot render="item" interactive="0" pointer="0" size="16" iconScale="1"><item>minecraft:air</item></slot>
            </div>
            <div id="panel-name"></div>
            <div id="panel-registry-name"></div>
            <div id="panel-uninstall">
                <texture src="superbwarfare:textures/overlay/edit/remove_attachment.png" />
            </div>
            <div id="panel-uninstall-label"></div>
            <div id="panel-skin-control">
                <div id="panel-skin-label"></div>
                <select id="panel-skin"></select>
            </div>
        </div>
        <!-- 弹种模式专用：装备中弹种的属性条（两列，各最多三项）。配件模式下这一行是"卸下 / 皮肤"。
             外层负责在这段空白里上下居中，内层才是一行两列：两列的项数可能不同，必须按行顶对齐。 -->
        <div id="panel-ammo-stats">
            <div id="panel-ammo-stats-line" class="ammo-stat-line">
                <div id="panel-ammo-stats-col0" class="ammo-stat-col"></div>
                <div id="panel-ammo-stats-col1" class="ammo-stat-col"></div>
            </div>
        </div>
        <!-- AUI 原生 overflow / scrollbar；Kotlin 复用可见区域附近的格子，保留完整列表滚动高度。 -->
        <div id="panel-list">
            <div id="panel-scroll"><div id="panel-space"></div></div>
            <div id="panel-items"><div id="panel-grid"></div><div id="panel-empty"></div></div>
        </div>
        <div id="panel-footer"><div id="panel-count"></div></div>
    </div>
    <div id="settings">
        <div id="settings-code" class="section-code">No.1145</div>
        <div id="settings-index" class="section-index"><span class="section-number">02</span><span class="section-slash">/</span></div>
        <div id="settings-title"></div>
        <button id="settings-reset" type="button"><span id="settings-reset-label" class="button-label"></span></button>
        <div id="settings-divider"></div>
        <div id="settings-controls">
            <div id="settings-rotation-row" class="settings-row">
                <div id="settings-rotation-icon" class="settings-icon"></div>
                <div id="settings-rotation-label" class="settings-label"></div>
                <div class="settings-slider">
                    <input id="settings-rotation" type="range" min="-180" max="180" step="1" value="0">
                    <div class="settings-track"></div>
                    <div id="settings-rotation-fill" class="settings-fill"></div>
                    <div id="settings-rotation-thumb" class="settings-thumb"></div>
                </div>
                <div class="settings-number">
                    <button id="settings-rotation-minus" class="settings-step" type="button"><span class="button-label">-</span></button>
                    <input id="settings-rotation-value" class="settings-value" type="text" inputmode="decimal" maxlength="12" value="0">
                    <button id="settings-rotation-plus" class="settings-step" type="button"><span class="button-label">+</span></button>
                </div>
            </div>
            <div id="settings-offset-row" class="settings-row">
                <div id="settings-offset-icon" class="settings-icon"><texture src="superbwarfare:textures/overlay/edit/icons/offset.png" blur="true" /></div>
                <div id="settings-offset-label" class="settings-label"></div>
                <div class="settings-slider">
                    <input id="settings-offset" type="range" value="0">
                    <div class="settings-track"></div>
                    <div id="settings-offset-fill" class="settings-fill"></div>
                    <div id="settings-offset-thumb" class="settings-thumb"></div>
                </div>
                <div class="settings-number">
                    <button id="settings-offset-minus" class="settings-step" type="button"><span class="button-label">-</span></button>
                    <input id="settings-offset-value" class="settings-value" type="text" inputmode="decimal" maxlength="12" value="0">
                    <button id="settings-offset-plus" class="settings-step" type="button"><span class="button-label">+</span></button>
                </div>
            </div>
            <div id="settings-red-row" class="settings-row">
                <div id="settings-red-icon" class="settings-icon"></div>
                <div class="settings-label">R</div>
                <div class="settings-slider">
                    <input id="settings-red" type="range" min="0" max="255" step="1" value="255">
                    <div class="settings-track"></div>
                    <div id="settings-red-fill" class="settings-fill"></div>
                    <div id="settings-red-thumb" class="settings-thumb"></div>
                </div>
                <div class="settings-number">
                    <button id="settings-red-minus" class="settings-step" type="button"><span class="button-label">-</span></button>
                    <input id="settings-red-value" class="settings-value" type="text" inputmode="numeric" maxlength="3" value="255">
                    <button id="settings-red-plus" class="settings-step" type="button"><span class="button-label">+</span></button>
                </div>
            </div>
            <div id="settings-green-row" class="settings-row">
                <div id="settings-green-icon" class="settings-icon"></div>
                <div class="settings-label">G</div>
                <div class="settings-slider">
                    <input id="settings-green" type="range" min="0" max="255" step="1" value="0">
                    <div class="settings-track"></div>
                    <div id="settings-green-fill" class="settings-fill"></div>
                    <div id="settings-green-thumb" class="settings-thumb"></div>
                </div>
                <div class="settings-number">
                    <button id="settings-green-minus" class="settings-step" type="button"><span class="button-label">-</span></button>
                    <input id="settings-green-value" class="settings-value" type="text" inputmode="numeric" maxlength="3" value="0">
                    <button id="settings-green-plus" class="settings-step" type="button"><span class="button-label">+</span></button>
                </div>
            </div>
            <div id="settings-blue-row" class="settings-row">
                <div id="settings-blue-icon" class="settings-icon"></div>
                <div class="settings-label">B</div>
                <div class="settings-slider">
                    <input id="settings-blue" type="range" min="0" max="255" step="1" value="0">
                    <div class="settings-track"></div>
                    <div id="settings-blue-fill" class="settings-fill"></div>
                    <div id="settings-blue-thumb" class="settings-thumb"></div>
                </div>
                <div class="settings-number">
                    <button id="settings-blue-minus" class="settings-step" type="button"><span class="button-label">-</span></button>
                    <input id="settings-blue-value" class="settings-value" type="text" inputmode="numeric" maxlength="3" value="0">
                    <button id="settings-blue-plus" class="settings-step" type="button"><span class="button-label">+</span></button>
                </div>
            </div>
            <div id="settings-hex-row" class="settings-row">
                <div id="settings-hex-icon" class="settings-icon"></div>
                <div class="settings-label">HEX</div>
                <div id="settings-color-swatch"></div>
                <input id="settings-color-hex" type="text" maxlength="7" value="#FF0000" placeholder="#RRGGBB">
            </div>
        </div>
        <button id="settings-confirm" type="button"><span id="settings-confirm-label" class="button-label"></span></button>
    </div>
</body>
<style>
    /* 思源黑体 Medium：SIL OFL 1.1，授权与来源见 fonts/OFL.txt、fonts/README.md。 */
    @font-face {
        font-family: WeaponEditHeading;
        src: url("fonts/SourceHanSansCN-Medium.otf");
    }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
    /* 包括动态挂点、属性行和原生下拉弹层；仅下方可编辑输入框允许选取文本。 */
    body, body * { user-select: none; }
    /* 页面、表单控件及 body 下的原生 select 弹层统一使用思源黑体 Medium。 */
    body, button, input, select, .aui-select-popup, .aui-select-option {
        font-family: WeaponEditHeading, sans-serif;
        font-weight: normal;
    }
    body { position: relative; color: #ffffff; font-size: 9px; }
    .button-label { display: block; width: 100%; height: 100%; text-align: center; pointer-events: none; white-space: nowrap; }
    #stats-toggle-label { line-height: 16px; }
    #settings-reset-label, #settings-confirm-label { line-height: 14px; }
    #backdrop { position: absolute; inset: 0; pointer-events: auto; }
    #title-bar {
        position: absolute; left: 0; top: 0; width: 100%; height: 18px;
        display: flex; align-items: center; gap: 8px; box-sizing: border-box;
        padding: 0 8px; border-bottom: 0.5px solid #237b87;
        background: rgba(0, 15, 23, 0.9); pointer-events: none; z-index: 6;
        white-space: nowrap; overflow: hidden;
    }
    #title-accent { width: 1.5px; height: 11px; background: #52fcda; flex-shrink: 0; }
    #title-brand { color: #a9c6d2; font-size: 6px; letter-spacing: 1.3px; flex-shrink: 0; }
    .title-separator { width: 0.5px; height: 8px; background: #668a95; flex-shrink: 0; }
    #title-mode { color: #52fcda; font-size: 8.5px; flex-shrink: 0; }
    #title-weapon { min-width: 0; height: 12px; line-height: 12px; font-size: 7px; overflow: hidden; text-overflow: ellipsis; }
    /* 右上角运行状态；版本号由 Kotlin 在文档准备阶段写入。 */
    #title-status {
        position: absolute; right: 6px; top: 3px; display: flex; align-items: center; gap: 5px;
        box-sizing: border-box; height: 12px;
        white-space: nowrap; pointer-events: none;
    }
    #title-status-dot { width: 4px; height: 4px; flex-shrink: 0; background: #52fcda; }
    #title-status-label { color: #a9c6d2; font-size: 5.5px; letter-spacing: 1px; }
    #title-version { color: #d3e5e9; font-size: 5.5px; letter-spacing: 0.4px; }
    #title-status > .title-separator { height: 7px; }
    .section-index { position: absolute; left: 5px; top: 3px; height: 18px; display: flex; align-items: center; gap: 4px; color: #52fcda; pointer-events: none; }
    .section-number { font-size: 13px; font-weight: 700; }
    .section-slash { font-size: 11px; font-weight: normal; }
    .section-code { position: absolute; right: 5px; color: #338997; font-size: 5px; letter-spacing: 0.5px; pointer-events: none; }
    #stats-index { left: 7px; }
    #stats-code { top: 8px; right: 4.5px; }
    #settings-code { left: auto; right: 4px; top: 8px; bottom: auto; height: 6px; line-height: 6px; }
    @media (max-width: 380px) {
        #title-bar { gap: 5px; padding: 0 6px; }
        #title-brand { letter-spacing: 0; }
        #stats-code, #title-status { display: none; }
    }
    @media (max-width: 260px) {
        #title-brand, #title-brand + .title-separator { display: none; }
    }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    #mount-layer { z-index: 2; }
    #icon-layer { z-index: 3; }
    /* 挂点仅提供透明点击区域，悬停不再改变其几何尺寸或触发圆圈的 CSS 绘制。 */
    .mount {
        position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: translate(0px, 0px);
        display: none; box-sizing: border-box; width: 9px; height: 9px;
        border: 0; border-radius: 4.5px; background: none;
        align-items: center; justify-content: center; pointer-events: auto;
    }
    .mount-label {
        position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: translate(0px, 0px);
        display: none; height: 11px; font-size: 7px; font-weight: normal;
        color: #ffffff; text-stroke: 1px #000000; text-align: center; white-space: nowrap;
        align-items: center; justify-content: center; pointer-events: none;
    }
    .mount-label.filled { color: #52fcda; }
    .attachment-icon, .cell {
        position: absolute; display: none; box-sizing: border-box; width: 17px; height: 17px;
        padding: 0; border: 0.5px solid #24606b; background: rgba(0, 19, 25, 0.8);
        align-items: center; justify-content: center; pointer-events: auto;
    }
    .attachment-icon:hover, .cell:hover { background: rgba(20, 90, 99, 0.8); border-color: #52fcda; }
    .attachment-icon.active { box-shadow: inset 0 0 0 0.5px #52fcda; }
    .attachment-icon.filled, .cell.selected { border-color: #52fcda; }
    .attachment-icon.filled.active, .cell.selected { box-shadow: inset 0 0 0 0.5px #52fcda; }
    .cell.selected { background: rgba(16, 88, 94, 0.85); }
    /* 保留 0.5px 边框占位使物品居中，挂点图标的可见外框交给独立绘制阶段。 */
    #icon-layer > .attachment-icon {
        left: 0; top: 0; transform-origin: 0 0; transform: translate(0px, 0px);
        border-color: transparent; box-shadow: none;
    }
    slot, item { pointer-events: none; }
    /* 覆盖 AUI global.css 的 18px 槽位和 slot > item 的 left/top: 1px。
       CSS 自定义属性优先于 size/iconScale 属性，因此两种物品框都明确设置尺寸与缩放。 */
    .attachment-icon > slot, .cell > slot {
        --aui-slot-size: 16;
        --aui-slot-icon-scale: 1;
        width: 16px; height: 16px; flex-shrink: 0;
        margin: 0; padding: 0; border: 0; background: none;
    }
    .cell > slot {
        --aui-slot-size: 15;
        --aui-slot-icon-scale: 0.9375;
        width: 15px; height: 15px;
    }
    slot > item { left: 0; top: 0; width: 100%; height: 100%; }
    /* 增加 22px 类型标题行与底部可用配件计数；Kotlin 使用相同外框尺寸进行避让与边缘钳制。 */
    #panel {
        position: absolute; left: 0; top: 0; transform: translate(0px, 0px) scale(1);
        display: none; box-sizing: border-box; width: 180px; height: 148px;
        border: 1px solid transparent; background: none;
        transform-origin: 0 0; pointer-events: auto; z-index: 4; font-weight: normal;
    }
    #panel-header { position: absolute; left: 5px; top: 27px; width: 168px; height: 34px; }
    #panel-code { top: 8px; right: 3.5px; }
    #panel-current { display: flex; left: 0; top: 0; }
    #panel-name {
        position: absolute; left: 22px; top: -1px; width: 146px; height: 11px;
        color: #bfc5c9; font-size: 9px; line-height: 11px; font-weight: normal;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #panel-registry-name {
        position: absolute; left: 22px; top: 10px; width: 146px; height: 7px;
        color: #bfc5c9; font-size: 5.5px; line-height: 7px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 保留原有卸下图标及点击位置，青色外框与其他控件统一。 */
    #panel-uninstall {
        position: absolute; display: flex; left: 0; top: 20.5px; width: 14px; height: 14px;
        box-sizing: border-box; align-items: center; justify-content: center;
        border: 0.5px solid #338997; background: rgba(0, 22, 29, 0.85);
    }
    #panel-uninstall > texture { width: 12px; height: 12px; pointer-events: none; }
    #panel-uninstall:hover { border-color: #52fcda; background: rgba(20, 90, 99, 0.8); }
    #panel-uninstall.disabled { opacity: 0.35; pointer-events: none; }
    #panel-uninstall-label, #panel-skin-label {
        font-size: 6.5px; line-height: 8px; font-weight: normal; color: #a9c6d2;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #panel-uninstall-label { position: absolute; left: 18px; top: 23.5px; width: 64px; height: 8px; }
    #panel-skin-control {
        position: absolute; right: 0; top: 20.5px; display: none; width: 86px; height: 14px;
        align-items: center; gap: 3px;
    }
    /* 标签单独留 20px，避免思源黑体的“皮肤”被省略号截断。 */
    #panel-skin-label { position: absolute; left: 0; top: 3px; width: 20px; height: 8px; }
    #panel-skin {
        position: absolute; left: 23px; top: 0; display: block; box-sizing: border-box; width: 63px; height: 14px;
        margin: 0; padding: 0 2px; border: 0.5px solid #338997; border-radius: 0;
        background: rgba(0, 18, 25, 0.9); color: #ffffff; font-size: 6.5px; line-height: 8px;
        font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        pointer-events: auto; cursor: pointer;
    }
    #panel-skin:hover, #panel-skin:focus, #gun-skin:hover, #gun-skin:focus { border-color: #52fcda; }
    #gun-skin-control {
        position: absolute; left: 0; top: 0; display: none; width: 112px; height: 17px;
        transform-origin: 0 0; pointer-events: auto; z-index: 5;
    }
    #gun-skin {
        display: block; box-sizing: border-box; width: 112px; height: 17px;
        margin: 0; padding: 0 5px; border: 0.5px solid #338997; border-radius: 0;
        background: rgba(0, 18, 25, 0.9); color: #ffffff; font-size: 9px; line-height: 10px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; cursor: pointer;
    }
    /* AUI 原生 select 弹层挂在 body 下，并用内联样式绘制默认亮色主题。
       两个皮肤选择器共用主题，弹层宽度由 Kotlin 按对应控件的实际宽度同步。 */
    .aui-select-popup {
        background: #00161e !important; color: #ffffff !important;
        border: 0.5px solid #52fcda !important; border-radius: 0 !important;
        padding: 0 !important; box-shadow: none !important;
        scrollbar-width: 3px; scrollbar-color: #52fcda #00161e;
    }
    .aui-select-option {
        height: 14px !important; min-height: 14px !important; padding: 0 3px !important;
        font-size: 6.5px !important; line-height: 8px !important;
        color: #ffffff !important; background-color: #00161e !important;
    }
    .aui-select-option[aria-selected="true"], .aui-select-option:hover {
        color: #00161e !important; background-color: #52fcda !important;
    }
    .aui-select-popup[data-gun-skin="true"] .aui-select-option {
        height: 17px !important; min-height: 17px !important;
        font-size: 9px !important; line-height: 10px !important;
    }
    #panel-list {
        position: absolute; left: 5px; top: 66px; width: 168px; height: 62px;
    }
    #panel-scroll {
        position: absolute; left: 0; top: 0; width: 168px; height: 62px;
        /* 分隔线由 Kotlin 独立绘制；透明边框保留原来的滚动布局。 */
        box-sizing: border-box; border-top: 1px solid transparent; padding-top: 5px;
        overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable;
        scrollbar-width: 6px; scrollbar-color: #338997 rgba(0, 18, 25, 0.7);
    }
    #panel-scroll::-webkit-scrollbar { width: 6px; }
    #panel-scroll::-webkit-scrollbar-track { background-color: rgba(0, 18, 25, 0.7); }
    #panel-scroll::-webkit-scrollbar-thumb { background-color: #338997; border-radius: 0; }
    /* 8 × 16 + 7 × 4 = 156px；扣除上边框与上内边距后，列表正好显示 56px（3 排）。 */
    #panel-space { width: 156px; height: 0; pointer-events: none; }
    /* 格子不作为滚动容器的后代，避免 AUI 在绘制阶段推进滚动动画后越过已经准备的窗口。 */
    #panel-items { position: absolute; left: 0; top: 6px; width: 156px; height: 56px; overflow: hidden; pointer-events: none; }
    /* Kotlin 将高度同步为完整列表高度，不能保持为 0，否则 AUI 会连同格子一起裁掉。 */
    #panel-grid { position: relative; top: 0; transform-origin: 0 0; transform: translateY(0px); width: 156px; height: 56px; }
    /* 循环行池使用平移定位；屏外缓冲行由 Kotlin 设为 visibility:hidden，保留布局并跳过物品绘制。 */
    .row {
        position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: translateY(0px);
        display: flex; flex-direction: row; gap: 4px; width: 156px; height: 16px;
    }
    .cell { position: relative; display: flex; width: 16px; height: 16px; padding: 0; flex-shrink: 0; }
    #panel-empty { display: none; font-size: 7px; color: #a9c6d2; padding: 8px 0; }
/* 弹种模式：装备中弹种的属性条（两列），占用配件模式下"卸下 / 皮肤"那一行。
   left 与 #panel-current 的左边线对齐（两者都在面板坐标 x=5）；行距取 line-height 本身（gap 为 0），
   比按 font-size 自然行高排出来的更紧。
   top + height 覆盖"图标下沿 → 列表分隔线"这段空白（44..78），justify-content: center 让整块
   在中间上下居中；内容项数变化（有没有爆炸那两项）时也始终居中。 */
#panel-ammo-stats {
    position: absolute; left: 5px; top: 44px; width: 163px; height: 34px;
    display: none; flex-direction: column; justify-content: center; pointer-events: none;
}
.ammo-stat-line { display: flex; flex-direction: row; gap: 6px; }
.ammo-stat-col { display: flex; flex-direction: column; gap: 0; width: 78px; }
.ammo-stat {
