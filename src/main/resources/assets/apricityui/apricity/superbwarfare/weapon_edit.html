<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-viewport" content="mode=gui,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
    <meta name="aui-mouse-events" content="intercept">
</head>
<body>
    <div id="backdrop"></div>
    <!-- AUI 负责挂点命中区域和图标布局；圆圈、外框与连线由 WeaponEditScreen 独立绘制。 -->
    <div id="mount-layer" class="layer"></div>
    <div id="icon-layer" class="layer"></div>
    <div id="weapon-stats">
        <button id="stats-toggle" type="button" aria-expanded="false"></button>
        <div id="stats-chart">
            <div id="stats-title"></div>
            <div id="stats-scroll"><div id="stats-content"></div></div>
        </div>
    </div>
    <div id="panel">
        <div id="panel-header">
            <div id="panel-current" class="attachment-icon">
                <slot render="item" interactive="0" pointer="0" size="16" iconScale="1"><item>minecraft:air</item></slot>
            </div>
            <div id="panel-name"></div>
            <div id="panel-uninstall">
                <texture src="superbwarfare:textures/overlay/edit/remove_attachment.png" />
            </div>
            <div id="panel-slot"></div>
        </div>
        <!-- AUI 原生 overflow / scrollbar；Kotlin 复用可见区域附近的格子，保留完整列表滚动高度。 -->
        <div id="panel-list">
            <div id="panel-scroll"><div id="panel-space"></div></div>
            <div id="panel-items"><div id="panel-grid"></div><div id="panel-empty"></div></div>
        </div>
    </div>
    <div id="settings">
        <div id="settings-title"></div>
        <button id="settings-reset" type="button">
            <texture src="superbwarfare:textures/overlay/edit/reset.png" />
        </button>
        <div id="settings-divider"></div>
        <div id="settings-controls">
            <div id="settings-rotation-row" class="settings-row">
                <div id="settings-rotation-label" class="settings-label"></div>
                <div class="settings-slider">
                    <input id="settings-rotation" type="range" min="-180" max="180" step="1" value="0">
                    <div id="settings-rotation-fill" class="settings-fill"></div>
                    <texture id="settings-rotation-thumb" class="settings-thumb" src="superbwarfare:textures/overlay/edit/circle.png" blur="true" />
                </div>
                <div class="settings-number">
                    <button id="settings-rotation-minus" class="settings-step" type="button">-</button>
                    <input id="settings-rotation-value" class="settings-value" type="text" inputmode="decimal" maxlength="12" value="0">
                    <button id="settings-rotation-plus" class="settings-step" type="button">+</button>
                </div>
            </div>
            <div id="settings-offset-row" class="settings-row">
                <div id="settings-offset-label" class="settings-label"></div>
                <div class="settings-slider">
                    <input id="settings-offset" type="range" value="0">
                    <div id="settings-offset-fill" class="settings-fill"></div>
                    <texture id="settings-offset-thumb" class="settings-thumb" src="superbwarfare:textures/overlay/edit/circle.png" blur="true" />
                </div>
                <div class="settings-number">
                    <button id="settings-offset-minus" class="settings-step" type="button">-</button>
                    <input id="settings-offset-value" class="settings-value" type="text" inputmode="decimal" maxlength="12" value="0">
                    <button id="settings-offset-plus" class="settings-step" type="button">+</button>
                </div>
            </div>
            <div id="settings-red-row" class="settings-row">
                <div class="settings-label">R</div>
                <div class="settings-slider">
                    <input id="settings-red" type="range" min="0" max="255" step="1" value="255">
                    <div id="settings-red-fill" class="settings-fill"></div>
                    <texture id="settings-red-thumb" class="settings-thumb" src="superbwarfare:textures/overlay/edit/circle.png" blur="true" />
                </div>
                <div class="settings-number">
                    <button id="settings-red-minus" class="settings-step" type="button">-</button>
                    <input id="settings-red-value" class="settings-value" type="text" inputmode="numeric" maxlength="3" value="255">
                    <button id="settings-red-plus" class="settings-step" type="button">+</button>
                </div>
            </div>
            <div id="settings-green-row" class="settings-row">
                <div class="settings-label">G</div>
                <div class="settings-slider">
                    <input id="settings-green" type="range" min="0" max="255" step="1" value="0">
                    <div id="settings-green-fill" class="settings-fill"></div>
                    <texture id="settings-green-thumb" class="settings-thumb" src="superbwarfare:textures/overlay/edit/circle.png" blur="true" />
                </div>
                <div class="settings-number">
                    <button id="settings-green-minus" class="settings-step" type="button">-</button>
                    <input id="settings-green-value" class="settings-value" type="text" inputmode="numeric" maxlength="3" value="0">
                    <button id="settings-green-plus" class="settings-step" type="button">+</button>
                </div>
            </div>
            <div id="settings-blue-row" class="settings-row">
                <div class="settings-label">B</div>
                <div class="settings-slider">
                    <input id="settings-blue" type="range" min="0" max="255" step="1" value="0">
                    <div id="settings-blue-fill" class="settings-fill"></div>
                    <texture id="settings-blue-thumb" class="settings-thumb" src="superbwarfare:textures/overlay/edit/circle.png" blur="true" />
                </div>
                <div class="settings-number">
                    <button id="settings-blue-minus" class="settings-step" type="button">-</button>
                    <input id="settings-blue-value" class="settings-value" type="text" inputmode="numeric" maxlength="3" value="0">
                    <button id="settings-blue-plus" class="settings-step" type="button">+</button>
                </div>
            </div>
            <div id="settings-hex-row" class="settings-row">
                <div class="settings-label">HEX</div>
                <div id="settings-color-swatch"></div>
                <input id="settings-color-hex" type="text" maxlength="7" value="#FF0000" placeholder="#RRGGBB">
            </div>
        </div>
        <button id="settings-confirm" type="button">
            <texture src="superbwarfare:textures/overlay/edit/accept.png" />
        </button>
    </div>
</body>
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
    body { position: relative; color: #ffffff; font-size: 9px; }
    #backdrop { position: absolute; inset: 0; pointer-events: auto; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    #mount-layer { z-index: 2; }
    #icon-layer { z-index: 3; }
    /* 挂点仅提供透明点击区域，悬停不再改变其几何尺寸或触发圆圈的 CSS 绘制。 */
    .mount {
        position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: translate(0px, 0px);
        display: none; box-sizing: border-box; width: 9px; height: 9px;
        border: 0; border-radius: 4.5px; background: none;
        align-items: center; justify-content: center; pointer-events: auto;
    }
    .mount-label {
        position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: translate(0px, 0px);
        display: none; height: 11px; font-size: 7px; font-weight: normal;
        color: #ffffff; text-stroke: 1px #000000; text-align: center; white-space: nowrap;
        align-items: center; justify-content: center; pointer-events: none;
    }
    .mount-label.filled { color: #ffb43b; }
    .attachment-icon, .cell {
        position: absolute; display: none; box-sizing: border-box; width: 17px; height: 17px;
        padding: 0; border: 0.5px solid #ffffff; background: rgba(13, 15, 19, 0.7);
        align-items: center; justify-content: center; pointer-events: auto;
    }
    .attachment-icon:hover, .cell:hover { background: rgba(100, 110, 125, 0.75); border-color: #ffffff; }
    .attachment-icon.active { box-shadow: inset 0 0 0 0.5px #ffffff; }
    .attachment-icon.filled, .cell.selected { border-color: #ffb43b; }
    .attachment-icon.filled.active, .cell.selected { box-shadow: inset 0 0 0 0.5px #ffb43b; }
    /* 保留 0.5px 边框占位使物品居中，挂点图标的可见外框交给独立绘制阶段。 */
    #icon-layer > .attachment-icon {
        left: 0; top: 0; transform-origin: 0 0; transform: translate(0px, 0px);
        border-color: transparent; box-shadow: none;
    }
    slot, item { pointer-events: none; }
    /* 覆盖 AUI global.css 的 18px 槽位和 slot > item 的 left/top: 1px。
       CSS 自定义属性优先于 size/iconScale 属性，因此两种物品框都明确设置尺寸与缩放。 */
    .attachment-icon > slot, .cell > slot {
        --aui-slot-size: 16;
        --aui-slot-icon-scale: 1;
        width: 16px; height: 16px; flex-shrink: 0;
        margin: 0; padding: 0; border: 0; background: none;
    }
    .cell > slot {
        --aui-slot-size: 15;
        --aui-slot-icon-scale: 0.9375;
        width: 15px; height: 15px;
    }
    slot > item { left: 0; top: 0; width: 100%; height: 100%; }
    /* 外框固定为 180 × 112；Kotlin 使用相同尺寸进行避让与边缘钳制。 */
    #panel {
        position: absolute; left: 0; top: 0; transform: translate(0px, 0px) scale(1);
        display: none; box-sizing: border-box; width: 180px; height: 112px;
        border: 1px solid transparent; background: none;
        transform-origin: 0 0; pointer-events: auto; z-index: 4; font-weight: normal;
    }
    #panel-header { position: absolute; left: 5px; top: 5px; width: 168px; height: 34px; }
    #panel-current { display: flex; left: 0; top: 0; }
    #panel-name {
        position: absolute; left: 22px; top: 1px; width: 146px; height: 14px;
        font-size: 9px; font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 卸下按钮是 28×28 的整张图（自带外框和底色），缩到 14×14 占位，不再叠 CSS 边框。 */
    #panel-uninstall {
        position: absolute; display: flex; left: 0; top: 19px; width: 14px; height: 14px;
        box-sizing: border-box; align-items: center; justify-content: center;
    }
    #panel-uninstall > texture { width: 14px; height: 14px; pointer-events: none; }
    #panel-uninstall:hover { opacity: 0.75; }
    #panel-uninstall.disabled { opacity: 0.35; pointer-events: none; }
    #panel-slot { position: absolute; left: 18px; top: 22px; width: 150px; font-size: 8px; color: #d0d0d0; }
    #panel-list {
        position: absolute; left: 5px; top: 44px; width: 168px; height: 62px;
    }
    #panel-scroll {
        position: absolute; left: 0; top: 0; width: 168px; height: 62px;
        box-sizing: border-box; border-top: 1px solid #ffffff; padding-top: 5px;
        overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable;
        scrollbar-width: 6px; scrollbar-color: #ffffff rgba(0, 0, 0, 0.55);
    }
    #panel-scroll::-webkit-scrollbar { width: 6px; }
    #panel-scroll::-webkit-scrollbar-track { background-color: rgba(0, 0, 0, 0.55); }
    #panel-scroll::-webkit-scrollbar-thumb { background-color: #ffffff; border-radius: 1px; }
    /* 8 × 16 + 7 × 4 = 156px；扣除上边框与上内边距后，列表正好显示 56px（3 排）。 */
    #panel-space { width: 156px; height: 0; pointer-events: none; }
    /* 格子不作为滚动容器的后代，避免 AUI 在绘制阶段推进滚动动画后越过已经准备的窗口。 */
    #panel-items { position: absolute; left: 0; top: 6px; width: 156px; height: 56px; overflow: hidden; pointer-events: none; }
    /* Kotlin 将高度同步为完整列表高度，不能保持为 0，否则 AUI 会连同格子一起裁掉。 */
    #panel-grid { position: relative; top: 0; transform-origin: 0 0; transform: translateY(0px); width: 156px; height: 56px; }
    /* 循环行池使用平移定位；屏外缓冲行由 Kotlin 设为 visibility:hidden，保留布局并跳过物品绘制。 */
    .row {
        position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: translateY(0px);
        display: flex; flex-direction: row; gap: 4px; width: 156px; height: 16px;
    }
    .cell { position: relative; display: flex; width: 16px; height: 16px; padding: 0; flex-shrink: 0; }
    #panel-empty { display: none; font-size: 9px; color: #bdbdbd; padding: 8px 0; }
    /* 与 Kotlin 的 SETTINGS_* 尺寸一致；只在选中已安装且可调整的槽位时显示。 */
    #settings {
        position: absolute; left: 0; top: 0; transform: translate(0px, 0px) scale(1);
        display: none; box-sizing: border-box; width: 180px; height: 56px;
        border: 1px solid transparent; background: none;
        transform-origin: 0 0; pointer-events: auto; z-index: 4; font-weight: normal;
    }
    #settings, #settings * { user-select: none; }
    #settings input[type="text"] { user-select: text; }
    #settings-title, #stats-title { position: absolute; top: 6px; height: 14px; font-size: 9px; font-weight: normal; }
    #settings-title { left: 5px; }
    #settings-reset, #settings-confirm {
        position: absolute; right: 5px; width: 15px; height: 15px; box-sizing: border-box;
        margin: 0; padding: 0; border: 0; border-radius: 0; background: none;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    #settings-reset { top: 5px; }
    #settings-confirm { bottom: 5px; }
    #settings-reset > texture, #settings-confirm > texture { width: 14px; height: 14px; pointer-events: none; }
    #settings-reset:hover, #settings-confirm:hover { opacity: 0.75; }
    #settings-confirm.disabled { opacity: 0.35; pointer-events: none; }
    /* 面板底板、白框和设置分隔线由 Kotlin 独立绘制；透明边框仍保留布局占位。 */
    #settings-divider { position: absolute; left: 5px; top: 23px; width: 168px; height: 1px; pointer-events: none; }
    #settings-controls { position: absolute; left: 5px; top: 28px; width: 168px; display: flex; flex-direction: column; }
    .settings-row { display: none; width: 168px; height: 24px; align-items: center; gap: 4px; }
    .settings-label { width: 23px; font-size: 9px; line-height: 7px; flex-shrink: 0; white-space: nowrap; }
    .settings-row > input, .settings-slider > input, .settings-value, .settings-step {
        display: block; box-sizing: border-box; height: 16px; flex-shrink: 0;
        margin: 0; padding: 0; border: 0.5px solid #bdbdbd; border-radius: 0;
        background: rgba(0, 0, 0, 0.2); color: #ffffff; font-size: 9px; line-height: 7px;
        font-weight: normal; pointer-events: auto;
    }
    .settings-slider { position: relative; width: 79px; height: 16px; flex-shrink: 0; }
    .settings-slider > input {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        accent-color: transparent;
    }
    .settings-fill {
        position: absolute; left: 0.5px; top: 6.5px; width: 0; height: 3px;
        background: #ffb43b; pointer-events: none;
    }
    .settings-thumb { position: absolute; left: 0; top: 3px; width: 10px; height: 10px; pointer-events: none; }
    .settings-number { display: flex; width: 58px; height: 16px; align-items: center; gap: 2px; flex-shrink: 0; }
    .settings-value { width: 32px; padding: 0 2px; text-align: center; }
    .settings-step { display: flex; width: 11px; align-items: center; justify-content: center; cursor: pointer; }
    .settings-step:hover { border-color: #ffb43b; background: rgba(100, 110, 125, 0.75); }
    .settings-value:focus { border-color: #ffb43b; }
    #settings-red-row .settings-fill { background: #ff6666; }
    #settings-green-row .settings-fill { background: #66ff66; }
    #settings-blue-row .settings-fill { background: #6666ff; }
    #settings-red-row > .settings-label { color: #ff8888; }
    #settings-green-row > .settings-label { color: #88ff88; }
    #settings-blue-row > .settings-label { color: #8888ff; }
    #settings-color-swatch { width: 16px; height: 16px; box-sizing: border-box; border: 0.5px solid #ffffff; flex-shrink: 0; }
    #settings-color-hex { width: 121px; padding: 0 3px; font-size: 9px; }
    #settings-color-hex:focus { border-color: #ffb43b; }
    /* 独立的紧凑属性面板；Kotlin 将整组宽高限制在可用视口的一半以内。 */
    #weapon-stats {
        position: absolute; left: 0; top: 0; width: 112px; height: 17px;
        transform-origin: 0 0; transform: translate(0px, 0px) scale(1);
        pointer-events: auto; z-index: 5; font-weight: normal;
    }
    #stats-toggle {
        position: absolute; left: 0; top: 0; display: flex; width: 112px; height: 17px;
        box-sizing: border-box; margin: 0; padding: 0; border: 0.5px solid #ffffff;
        background: rgba(15, 17, 21, 0.78); color: #ffffff; font-size: 9px; font-weight: normal;
        align-items: center; justify-content: center; cursor: pointer;
    }
    #stats-toggle:hover { background: rgba(80, 90, 105, 0.85); border-color: #ffb43b; }
    #stats-chart {
        position: absolute; left: 0; top: 21px; display: none; width: 100%; height: 98px;
        box-sizing: border-box; border: 0.5px solid #ffffff; background: rgba(15, 17, 21, 0.82);
    }
    #stats-title { left: 7px; }
    #stats-scroll {
        position: absolute; left: 7px; top: 22px; width: 196px; height: 70px;
        margin: 0; padding: 0; border: 0; box-sizing: border-box;
        overflow-x: hidden; overflow-y: auto; scrollbar-gutter: auto;
        scrollbar-width: 4px; scrollbar-color: #bfc5cf rgba(0, 0, 0, 0.4);
    }
    #stats-content { position: relative; width: 188px; margin: 0; padding: 0; border: 0; }
    .stat-row { position: relative; display: block; width: 100%; height: 14px; margin: 0; padding: 0; border: 0; font-size: 9px; }
    .stat-label, .stat-value, .stat-delta { position: absolute; top: 1px; height: 12px; white-space: nowrap; overflow: hidden; pointer-events: none; }
    .stat-label { left: 0; width: 29%; color: #d8dce2; }
    .stat-value { left: 60%; width: 19%; color: #ffffff; }
    .stat-delta { left: 81%; width: 19%; }
    .stat-text {
        position: absolute; left: 0; top: 0; width: max-content; height: 12px; white-space: nowrap;
        text-align: left; pointer-events: none; transform-origin: 0 0; transform: translateX(0px);
    }
    .stat-track { position: absolute; left: 31%; top: 5px; width: 27%; height: 4px; background: rgba(0, 0, 0, 0.7); pointer-events: none; }
    .stat-common, .stat-change, .stat-overflow { position: absolute; left: 0; top: 0; width: 0; height: 4px; pointer-events: none; }
    .stat-common { background: #e6e9ee; }
    .stat-overflow { background: #f5c45b; }
</style>
</html>
