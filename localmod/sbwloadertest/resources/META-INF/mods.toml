# 插件服务的宿主：optional + AFTER，保证 Superb Warfare 先完成自身注册。
# 版本范围不要写成 [0.8.10,)：Maven 版本序里 0.8.10-snapshot < 0.8.10，
# 当前 mod_version 正是 0.8.10-snapshot，会被判为不满足而直接崩在 pre-loading。
[[dependencies.sbwloadertest]]
modId = "superbwarfare"
mandatory = false
versionRange = "[0.8,)"
ordering = "AFTER"
side = "BOTH"
